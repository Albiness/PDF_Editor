
name: pdf_editor_android
description: "PDF Editor Android application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  file_picker: ^13.1.0
  syncfusion_flutter_pdfviewer: ^35.1.39
  syncfusion_flutter_pdf: ^35.1.39
  path_provider: ^2.1.6
  signature: ^6.4.0
  cupertino_icons: ^1.0.9
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: PdfEditorText
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf

  assets:
    - assets/fonts/DejaVuSans.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
